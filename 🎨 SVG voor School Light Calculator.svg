<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E0"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD966" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFD966" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ronde achtergrond -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bgGrad)"/>

  <!-- Glow achter de lamp -->
  <circle cx="256" cy="180" r="150" fill="url(#glowGrad)"/>

  <!-- Lamp bol -->
  <circle cx="256" cy="180" r="75" fill="url(#bulbGrad)"/>
  
  <!-- Highlight op bol -->
  <ellipse cx="230" cy="155" rx="25" ry="18" fill="#FFFEF5" opacity="0.9"/>

  <!-- Lamp gloeidraad (lijnen) -->
  <path d="M 230 200 Q 245 175 256 200 Q 267 175 282 200" 
        stroke="#FF8C00" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Lamp fitting -->
  <rect x="225" y="248" width="62" height="12" rx="3" fill="#94A3B8"/>
  <rect x="225" y="263" width="62" height="12" rx="3" fill="#64748B"/>
  <rect x="225" y="278" width="62" height="12" rx="3" fill="#475569"/>
  <ellipse cx="256" cy="296" rx="18" ry="6" fill="#334155"/>

  <!-- Open boek onder de lamp -->
  <g transform="translate(120, 340)">
    <!-- Linker pagina -->
    <path d="M 0 20 Q 20 5 65 5 L 65 100 Q 20 100 0 115 Z" 
          fill="url(#bookGrad)" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
    <!-- Rechter pagina -->
    <path d="M 272 20 Q 252 5 207 5 L 207 100 Q 252 100 272 115 Z" 
          fill="url(#bookGrad)" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
    <!-- Boekrug -->
    <line x1="136" y1="10" x2="136" y2="105" stroke="#0F172A" stroke-width="6"/>
    
    <!-- Lijnen op pagina's (tekst) -->
    <line x1="20" y1="40" x2="55" y2="38" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="55" x2="55" y2="53" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="55" y2="68" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="85" x2="45" y2="83" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="217" y1="38" x2="252" y2="40" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="217" y1="53" x2="252" y2="55" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="217" y1="68" x2="252" y2="70" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="217" y1="83" x2="247" y2="85" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>