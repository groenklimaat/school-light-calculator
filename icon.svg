<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Groene achtergrond gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    
    <!-- Lamp bol gradient (goud) -->
    <radialGradient id="lampGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9E0"/>
      <stop offset="45%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    
    <!-- Glow effect -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Boek pagina gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    
    <!-- Schaduw filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ronde achtergrond -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Decoratieve cirkels -->
  <circle cx="90" cy="90" r="120" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="430" cy="430" r="150" fill="#FFFFFF" opacity="0.06"/>

  <!-- Glow achter de lamp -->
  <circle cx="256" cy="200" r="200" fill="url(#glowGrad)"/>

  <!-- Lamp bol -->
  <circle cx="256" cy="200" r="110" fill="url(#lampGrad)"/>

  <!-- Lamp highlight (glans) -->
  <ellipse cx="215" cy="160" rx="38" ry="28" fill="#FFF9E0" opacity="0.8"/>

  <!-- Gloeidraad binnenin -->
  <path d="M 256 130 Q 225 180 256 230 Q 287 280 256 300" 
        stroke="#F59E0B" stroke-width="5" fill="none" 
        opacity="0.35" stroke-linecap="round"/>

  <!-- Lamp fitting (schroef) -->
  <rect x="220" y="302" width="72" height="16" rx="5" fill="#C0C0C0"/>
  <rect x="220" y="322" width="72" height="16" rx="5" fill="#A8A8A8"/>
  <rect x="220" y="342" width="72" height="16" rx="5" fill="#909090"/>

  <!-- Lampvoet onderaan -->
  <ellipse cx="256" cy="368" rx="28" ry="10" fill="#606060"/>

  <!-- Open boek onder de lamp -->
  <g transform="translate(120, 380)">
    <!-- Linker pagina -->
    <path d="M 0 15 Q 68 -10 136 15 L 136 95 Q 68 70 0 95 Z" 
          fill="url(#bookGrad)" filter="url(#shadow)" 
          stroke="#A7F3D0" stroke-width="2"/>
    
    <!-- Rechter pagina -->
    <path d="M 272 15 Q 204 -10 136 15 L 136 95 Q 204 70 272 95 Z" 
          fill="url(#bookGrad)" filter="url(#shadow)" 
          stroke="#A7F3D0" stroke-width="2"/>
    
    <!-- Boek rug (middel) -->
    <line x1="136" y1="15" x2="136" y2="95" 
          stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Tekstregels linker pagina -->
    <line x1="20" y1="35" x2="105" y2="28" stroke="#10B981" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="20" y1="52" x2="120" y2="46" stroke="#10B981" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="20" y1="69" x2="100" y2="64" stroke="#10B981" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    
    <!-- Tekstregels rechter pagina -->
    <line x1="167" y1="28" x2="252" y2="35" stroke="#10B981" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="152" y1="46" x2="252" y2="52" stroke="#10B981" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="172" y1="64" x2="252" y2="69" stroke="#10B981" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Kleine blad-accenten (duurzaamheid) -->
  <g opacity="0.7">
    <path d="M 60 260 Q 60 240 80 240 Q 80 260 60 260 Z" fill="#FCD34D"/>
    <path d="M 452 260 Q 452 240 432 240 Q 432 260 452 260 Z" fill="#FCD34D"/>
  </g>
</svg>